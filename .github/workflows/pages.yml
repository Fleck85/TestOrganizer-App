name: Publish approved general app
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'VEROEFFENTLICHEN eingeben'
        required: true
        default: 'NICHT VEROEFFENTLICHEN'
      expected_commit:
        description: 'Vollständiger geprüfter Commit-SHA dieses öffentlichen Repositorys'
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirmation == 'VEROEFFENTLICHEN'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the reviewed public commit
        env:
          EXPECTED: ${{ inputs.expected_commit }}
        run: test "$GITHUB_SHA" = "$EXPECTED"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node verify-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
